[package]
name = "stratyx-site"
version = "0.1.0"
edition = "2024"
publish = false
description = "Le site de STRATYX, écrit entièrement en Rust avec Paquets : pages SEO, PWA, dessins 2D et démos du moteur poker en WebAssembly."

# Crate autonome : hors du workspace STRATYX (son audit `cargo deny` ne couvre que le
# produit). Le site réutilise le moteur `stratyx-poker`, compilé aussi en WebAssembly.
[workspace]

[lib]
name = "stratyx_site"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stratyx-site"
path = "src/main.rs"

[dependencies]
stratyx-poker = { path = "../poker" }
stratyx-shared = { path = "../shared" }
stratyx-strategy = { path = "../strategy" }
stratyx-analytics = { path = "../analytics" }
stratyx-vision = { path = "../vision" }

# Serveur : la liste d'attente et les messages vont dans Nuage DB (la base de Memoire, en Rust
# pur), embarqué dans le serveur, avec ses sauvegardes S3 restaurées au démarrage : le disque
# d'Heroku est effacé à chaque redémarrage (voir site/README.md, « Base de données »). Nuage est
# utilisé par son interface SQL : il a sa propre version de Memoire, distincte de celle de
# Paquets, et les deux ne se croisent pas. Pas de SQLite ni de PostgreSQL dans Paquets.
# `compress` : réponses en Brotli ou gzip (brotli et flate2/miniz_oxide, en Rust pur).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
paquets = { git = "https://github.com/maxlestage/Paquets", default-features = false, features = ["compress"] }
# Sans son site web (`default-features = false`) : le moteur, le mode embarqué, les sauvegardes.
nuage = { git = "https://github.com/maxlestage/Nuage", default-features = false }
# Pour l'export statique (déjà utilisé par Paquets).
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
paquets = { git = "https://github.com/maxlestage/Paquets", default-features = false, features = ["client"] }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
# Le hasard de `rand` dans le navigateur (voir .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions", "Blob", "CanvasGradient", "CanvasRenderingContext2d", "CssStyleDeclaration",
  "DisplayMediaStreamConstraints", "Document", "DomRect", "File", "FileList", "FileReader", "DomTokenList", "Element", "Event", "EventTarget", "HtmlCanvasElement",
  "HtmlElement", "HtmlImageElement", "HtmlInputElement", "HtmlMediaElement", "HtmlVideoElement", "ImageData", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit",
  "KeyboardEvent", "Location", "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "MediaQueryList", "MouseEvent", "MutationObserver",
  "MutationObserverInit", "Navigator", "NodeList", "Performance", "PointerEvent",
  "ScrollBehavior", "ScrollToOptions", "ServiceWorker", "ServiceWorkerContainer",
  "ServiceWorkerRegistration", "ServiceWorkerState", "Storage", "Url", "UrlSearchParams", "VisibilityState", "Window",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
