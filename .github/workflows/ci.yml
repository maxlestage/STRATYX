# Teste chaque push. Quand tout est vert, la branche est fusionnée dans master
# automatiquement (sauf les branches wip/...), puis le site est déployé sur
# Heroku (heroku.yml).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatage
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace
      - name: Tests (avec serveur X virtuel pour la capture d'écran)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test --workspace
      - name: Évaluateur exhaustif (133 784 560 mains à 7 cartes)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p stratyx-poker -- --ignored

  audit:
    name: Audit des dépendances (règle 100 % Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  site:
    name: Site web (Paquets, WebAssembly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Cible WebAssembly (toolchain de rust-toolchain.toml)
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - name: Formatage
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint WebAssembly
        run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test --locked

  # Le bundle WebAssembly tel que Heroku le sert (cargo wasm-release puis wasm-bindgen, comme
  # heroku-build.sh), et sa taille brute, gzip et Brotli dans le résumé du run. Informatif :
  # hors des dépendances de `merge`, il ne retarde ni ne bloque la fusion.
  bundle:
    name: Bundle WebAssembly (taille)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cible WebAssembly (toolchain de rust-toolchain.toml)
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - name: Construire le bundle
        run: |
          set -euo pipefail
          cargo build --locked --lib --target wasm32-unknown-unknown --profile wasm-release
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          bin="$RUNNER_TEMP/wasm-bindgen-$version"
          mkdir -p "$bin"
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$bin"
          "$bin/wasm-bindgen" --target web --no-typescript --out-dir pkg \
            target/wasm32-unknown-unknown/wasm-release/stratyx_site.wasm
      - name: Taille
        run: |
          set -euo pipefail
          taille() { stat -c %s "$1"; }
          {
            echo "### Bundle WebAssembly servi"
            echo
            echo "| Fichier | Brut | gzip -9 | Brotli -q 11 |"
            echo "|---|---:|---:|---:|"
            for f in pkg/stratyx_site_bg.wasm pkg/stratyx_site.js; do
              gz=$(gzip -9 -c "$f" | wc -c)
              if command -v brotli > /dev/null; then
                br=$(brotli -q 11 -c "$f" | wc -c)
              else
                br="—"
              fi
              echo "| \`$(basename "$f")\` | $(taille "$f") | $gz | $br |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  merge:
    name: Fusion dans master
    needs: [test, audit, site]
    if: >-
      github.event_name == 'push' && github.ref_name != 'master' &&
      github.ref_name != 'main' && !startsWith(github.ref_name, 'wip/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: merge-into-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Fusion de ${{ github.ref_name }}
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$SHA"
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "$BRANCH est déjà dans master."
            exit 0
          fi
          git merge --no-ff --no-edit "$SHA" -m "Fusion de '$BRANCH' dans master (automatique)"
          git push origin HEAD:master
      # Un push fait par un workflow ne lance aucun autre workflow : on lance le déploiement.
      - name: Déployer sur Heroku
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run heroku.yml --ref master --repo "$GITHUB_REPOSITORY"
