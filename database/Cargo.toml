[package]
name = "stratyx-database"
description = "Persistance locale (redb) des bases Expresso, Tournois, Hold'em, Stratégie et Utilisateurs ; import et export des historiques texte."
version.workspace = true
edition.workspace = true
# redb 4 exige Rust 1.90 (la chaîne d'outils du projet suit la version stable).
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
stratyx-shared.workspace = true
stratyx-poker.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Base embarquée transactionnelle en Rust pur (décision T3).
redb = { version = "4.4", default-features = false, features = ["std"] }
# SHA-256 en Rust pur (RustCrypto), sans assembleur ni identifiants OID.
sha2 = { version = "0.11", default-features = false }
# Nuage DB embarqué (moteur seul, `default-features = false` : Rust pur, sans réseau), futur
# stockage de la base locale (chantier Nuage, docs/routine-optimisation.md). Optionnel tant que
# le stockage redb reste celui par défaut. Épinglé sur la branche `claude/nuage-100-rust` de
# Nuage (moteur embarqué sans ring), non encore fusionnée.
nuage = { git = "https://github.com/maxlestage/Nuage", rev = "5fd8056", default-features = false, optional = true }

[features]
## Le stockage Nuage DB (en cours de construction ; redb reste le stockage par défaut).
nuage = ["dep:nuage"]

[dev-dependencies]
# Fuzzing déterministe de l'import (tests/import_robustesse.rs).
rand.workspace = true
rand_chacha.workspace = true

[lints]
workspace = true
