name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatage
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace
      - name: Tests (avec serveur X virtuel pour la capture d'écran)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test --workspace
      - name: Évaluateur exhaustif (133 784 560 mains à 7 cartes)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p stratyx-poker -- --ignored

  audit:
    name: Audit des dépendances (règle 100 % Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
