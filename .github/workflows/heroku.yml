# Déploie master sur Heroku (le site web), sans la CLI Heroku : tout passe par
# l'API Heroku, donc tout se règle et se lance depuis un téléphone. Heroku compile
# lui-même le site avec le buildpack emk/rust (RustConfig, heroku-build.sh, Procfile),
# sur la stack heroku-26.
#
# Réglages (GitHub → Settings → Secrets and variables → Actions) :
#   - secret   HEROKU_API_KEY   Heroku → Account settings → API Key → Reveal
#   - variable HEROKU_APP_NAME  le nom de l'app (créée si elle n'existe pas)
#   - variable facultative HEROKU_REGION : us (par défaut) ou eu
#   - secrets facultatifs NUAGE_ENCRYPTION_KEY et NUAGE_BACKUP_S3_BUCKET, _ENDPOINT, _REGION,
#     _ACCESS_KEY_ID, _SECRET_ACCESS_KEY : la base Nuage DB du site (liste d'attente,
#     messages) chiffrée et sauvegardée sur un stockage compatible S3, restaurée à chaque
#     démarrage ; sans eux, elle est perdue à chaque redémarrage (voir site/README.md,
#     « Base de données »)
# Sans eux, le déploiement est sauté (sans erreur).

name: Déploiement Heroku

# Lancé après chaque fusion dans master par ci.yml, par un push direct sur master, et à
# la main : Actions → Déploiement Heroku → Run workflow (l'app GitHub mobile aussi).
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: heroku
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      NUAGE_ENCRYPTION_KEY: ${{ secrets.NUAGE_ENCRYPTION_KEY }}
      NUAGE_BACKUP_S3_BUCKET: ${{ secrets.NUAGE_BACKUP_S3_BUCKET }}
      NUAGE_BACKUP_S3_ENDPOINT: ${{ secrets.NUAGE_BACKUP_S3_ENDPOINT }}
      NUAGE_BACKUP_S3_REGION: ${{ secrets.NUAGE_BACKUP_S3_REGION }}
      NUAGE_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.NUAGE_BACKUP_S3_ACCESS_KEY_ID }}
      NUAGE_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.NUAGE_BACKUP_S3_SECRET_ACCESS_KEY }}
      APP: ${{ vars.HEROKU_APP_NAME }}
      REGION: ${{ vars.HEROKU_REGION || 'us' }}
      STACK: heroku-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Compiler et publier sur Heroku
        run: |
          set -euo pipefail
          if [ -z "${HEROKU_API_KEY:-}" ] || [ -z "${APP:-}" ]; then
            echo "::notice::Heroku n'est pas configuré : ajoutez le secret HEROKU_API_KEY et la variable HEROKU_APP_NAME (Settings → Secrets and variables → Actions)."
            exit 0
          fi
          api() {
            curl -fsS -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              -H "Content-Type: application/json" "$@"
          }
          info="$RUNNER_TEMP/app.json"
          status=$(curl -sS -o "$info" -w '%{http_code}' \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$APP")
          case "$status" in
            200) echo "App $APP trouvée." ;;
            404)
              echo "Création de l'app $APP ($REGION)…"
              api -X POST https://api.heroku.com/apps \
                -d "{\"name\":\"$APP\",\"region\":\"$REGION\",\"stack\":\"$STACK\"}" > "$info" ;;
            401) echo "::error::Heroku refuse la clé d'API (HEROKU_API_KEY)."; exit 1 ;;
            403) echo "::error::Ce compte Heroku ne peut pas utiliser l'app « $APP » (le nom est peut-être pris)."; exit 1 ;;
            *) echo "::error::Réponse inattendue de Heroku ($status) : $(cat "$info")"; exit 1 ;;
          esac
          # Une app en stack « container » (Docker) repasse sur la stack du buildpack.
          if [ "$(jq -r '.build_stack.name' "$info")" = container ]; then
            echo "Passage de l'app sur la stack $STACK…"
            api -X PATCH "https://api.heroku.com/apps/$APP" -d "{\"build_stack\":\"$STACK\"}" > /dev/null
          fi
          api -X PUT "https://api.heroku.com/apps/$APP/buildpack-installations" \
            -d '{"updates":[{"buildpack":"emk/rust"}]}' > /dev/null

          # L'adresse publique, pour les liens canoniques et le plan du site.
          url=$(api "https://api.heroku.com/apps/$APP" | jq -r '.web_url' | sed 's#/$##')
          api -X PATCH "https://api.heroku.com/apps/$APP/config-vars" \
            -d "{\"SITE_URL\":\"$url\"}" > /dev/null
          # La base Nuage DB : clé de chiffrement et sauvegardes S3, pour les secrets qui
          # existent. jq échappe les valeurs ; GitHub les masque dans les journaux. L'ancien
          # DATABASE_URL (PostgreSQL) n'est plus utilisé : il est retiré (null).
          vars=$(jq -n '$ENV | with_entries(select((.key | startswith("NUAGE_")) and .value != ""))')
          jq -n --argjson v "$vars" '$v + {DATABASE_URL: null}' \
            | api -X PATCH "https://api.heroku.com/apps/$APP/config-vars" -d @- > /dev/null
          if [ -n "${NUAGE_BACKUP_S3_BUCKET:-}" ]; then
            echo "Base de données : Nuage DB, sauvegardée sur S3 ($(jq -r 'keys | join(", ")' <<< "$vars"))."
          else
            echo "::notice::Pas de secret NUAGE_BACKUP_S3_BUCKET : la base Nuage DB du site est perdue à chaque redémarrage. Voir site/README.md, « Base de données »."
          fi

          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tgz" HEAD
          sources=$(api -X POST https://api.heroku.com/sources)
          curl -fsS -X PUT -H "Content-Type:" --data-binary @"$RUNNER_TEMP/source.tgz" \
            "$(jq -r '.source_blob.put_url' <<< "$sources")"

          echo "Compilation sur Heroku (la première prend une quinzaine de minutes, les suivantes bien moins grâce au cache)…"
          build=$(api -X POST "https://api.heroku.com/apps/$APP/builds" \
            -d "{\"source_blob\":{\"url\":\"$(jq -r '.source_blob.get_url' <<< "$sources")\",\"version\":\"$GITHUB_SHA\"}}")
          id=$(jq -r '.id' <<< "$build")
          curl -sSN "$(jq -r '.output_stream_url' <<< "$build")" || true

          result=pending
          for _ in $(seq 1 360); do
            result=$(api "https://api.heroku.com/apps/$APP/builds/$id" | jq -r '.status')
            [ "$result" != "pending" ] && break
            sleep 5
          done
          if [ "$result" != "succeeded" ]; then
            echo "::error::La compilation Heroku s'est terminée avec le statut « $result »."
            exit 1
          fi

          # Le site répond-il ?
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/health" || true)
            [ "$code" = 200 ] && break
            sleep 5
          done
          if [ "$code" != 200 ]; then
            echo "::error::Le site ne répond pas sur $url/health (code $code)."
            exit 1
          fi
          echo "### ♠ Déployé sur [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Déployé : $url"
