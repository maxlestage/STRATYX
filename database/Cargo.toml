[package]
name = "stratyx-database"
description = "Persistance locale (Nuage DB) des bases Expresso, Tournois, Hold'em, Stratégie et Utilisateurs ; import et export des historiques texte."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
stratyx-shared.workspace = true
stratyx-poker.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# SHA-256 en Rust pur (RustCrypto), sans assembleur ni identifiants OID.
sha2 = { version = "0.11", default-features = false }
# Nuage DB embarqué : la base locale (décision T14). Moteur seul (`default-features = false`) :
# Rust pur, sans réseau, chiffrement RustCrypto.
nuage = { git = "https://github.com/maxlestage/Nuage", rev = "997927b", default-features = false }
# Les valeurs des lignes SQL de Nuage (même crate que celui de Nuage, aucune dépendance de plus).
memoire-orm = { git = "https://github.com/maxlestage/Memoire", rev = "074fbde", default-features = false }
# Ancien stockage (redb, décision T3), lu une seule fois pour importer une ancienne base.
redb = { version = "4.4", default-features = false, features = ["std"], optional = true }

[features]
default = ["import-redb"]
## Import automatique d'une ancienne base redb à son ouverture (fichier unique).
import-redb = ["dep:redb"]

[dev-dependencies]
# Fuzzing déterministe de l'import (tests/import_robustesse.rs).
rand.workspace = true
rand_chacha.workspace = true

[lints]
workspace = true
